name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.13.0
      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Test
        run: uv run --frozen --extra dev pytest -q
      - name: Lint
        run: uv run --frozen --extra dev ruff check .
      - name: Check formatting
        run: uv run --frozen --extra dev ruff format --check .
      - name: Type check
        run: uv run --frozen --extra dev mypy
      - name: Build and check distributions
        run: |
          uv run --frozen --extra dev python -m build
          uv run --frozen --extra dev twine check dist/*
      - name: Action requirements match the lockfile
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/req.txt"
          diff <(grep -v '^#' action-requirements.txt) <(grep -v '^#' "$RUNNER_TEMP/req.txt")
      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run --frozen --extra dev pip-audit --local --skip-editable --progress-spinner off

  record:
    name: Fresh Chromium recording
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.13.0
      - name: Install dependencies and Chromium
        run: |
          uv sync --frozen --extra dev --python 3.13
          uv run --frozen --extra dev playwright install --with-deps chromium
      - name: Record the demo shop and expect the same data flows
        env:
          PFI_RECORD: "1"
        run: uv run --frozen --extra dev pytest -q tests/test_record.py

  dogfood:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Inspect the demo capture with the action
        id: gate
        uses: ./
        with:
          har: examples/recorded/*.har
          config: examples/pfi.toml
          fail-on: never
      - name: Expect a rejection, linked SARIF and a clean redacted copy
        env:
          DECISION: ${{ steps.gate.outputs.decision }}
          SARIF: ${{ steps.gate.outputs.sarif }}
        run: |
          test "$DECISION" = "reject"
          python - <<'EOF'
          import json, os, pathlib
          out = pathlib.Path("privacy-flow-reports")
          report = json.loads((out / "report.json").read_text(encoding="utf-8"))
          flows = {(f["rule_id"], f["recipient"]) for f in report["findings"]}
          expected = {("PFI-PERSONA", "legacy-ads.test"), ("PFI-PERSONA", "pixel-tracker.test"),
                      ("PFI-DE-KVNR", "session-cam.test"), ("PFI-HEALTH-FIELD", "session-cam.test")}
          assert expected <= flows, expected - flows
          sarif = json.loads(pathlib.Path(os.environ["SARIF"]).read_text(encoding="utf-8"))
          uris = {r["locations"][0]["physicalLocation"]["artifactLocation"]["uri"] for r in sarif["runs"][0]["results"]}
          assert uris == {"examples/recorded/demo-shop.har"}, uris
          redacted = (out / "redacted" / "demo-shop.redacted.har").read_text(encoding="utf-8").lower()
          assert "jane.test@example.com" not in redacted and "a123456780" not in redacted
          print(report["summary"])
          EOF
      - name: Gate fails the step when the decision meets fail-on
        id: strict
        continue-on-error: true
        uses: ./
        with:
          har: examples/recorded/demo-shop.har
          config: examples/pfi.toml
          output-dir: strict-reports
      - name: A pattern that matches nothing is an error
        id: nomatch
        continue-on-error: true
        uses: ./
        with:
          har: does-not-exist/*.har
          output-dir: nomatch-reports
      - name: Expect failures from the strict and no-match runs
        env:
          STRICT: ${{ steps.strict.outcome }}
          STRICT_DECISION: ${{ steps.strict.outputs.decision }}
          NOMATCH: ${{ steps.nomatch.outcome }}
        run: |
          test "$STRICT" = "failure"
          test "$STRICT_DECISION" = "reject"
          test "$NOMATCH" = "failure"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: demo-privacy-reports-${{ matrix.os }}
          path: privacy-flow-reports/
          retention-days: 14
